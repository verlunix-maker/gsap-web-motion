<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aksen Ranting Pinus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eaf5ee;color:#17321f}
.stage{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.sprig{position:absolute;pointer-events:none;z-index:1}
.sprig svg{display:block;width:100%;height:100%}
.needle{position:absolute;top:0;width:14px;height:3px;border-radius:2px;pointer-events:none;z-index:1}
.card{position:relative;z-index:2;background:rgba(255,255,255,.7);padding:32px;border-radius:20px;max-width:520px;border:1px solid rgba(23,50,31,.1)}
.card h1{font-size:clamp(30px,5vw,48px);margin-bottom:12px}
.card p{line-height:1.6;color:#2f4a3a}
</style>
</head>
<body>
<section class="stage">
  <div class="card">
    <h1>Aksen Ranting Pinus</h1>
    <p>Ranting dan daun pinus melayang di belakang konten. Blur membuat aksen terasa berlapis dan tidak mengganggu teks.</p>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.querySelector('.stage');
const NS='http://www.w3.org/2000/svg';
const rnd=(a,b)=>a+Math.random()*(b-a);

function sprig(){
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 120 240');
  const stem=document.createElementNS(NS,'path');
  stem.setAttribute('d','M60 235 Q50 120 62 5');stem.setAttribute('fill','none');
  stem.setAttribute('stroke','#8a6a3b');stem.setAttribute('stroke-width','2.5');stem.setAttribute('stroke-linecap','round');
  s.appendChild(stem);
  for(let i=0;i<20;i++){
    const y=220-i*10,side=i%2?1:-1,len=34-i*.9;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',60);l.setAttribute('y1',y);
    l.setAttribute('x2',60+side*len*.9);l.setAttribute('y2',y-len*.45);
    l.setAttribute('stroke','#7fc27a');l.setAttribute('stroke-width','2.6');l.setAttribute('stroke-linecap','round');
    s.appendChild(l);
  }
  return s;
}

for(let i=0;i<10;i++){
  const d=document.createElement('div');
  d.className='sprig';
  const size=rnd(120,300),depth=Math.random();
  d.style.width=size+'px';d.style.height=(size*2)+'px';
  d.style.left=rnd(-5,100)+'%';d.style.top=rnd(-10,100)+'%';
  d.style.filter='blur('+(4-depth*4).toFixed(1)+'px)';
  d.style.opacity=(.35+depth*.5).toFixed(2);
  d.appendChild(sprig());
  stage.appendChild(d);
  if(!reduce){
    gsap.to(d,{x:'+='+rnd(-20,20),y:'+='+rnd(-30,30),rotation:rnd(-25,25),duration:rnd(4,7),yoyo:true,repeat:-1,ease:'sine.inOut'});
  }
}

function needle(){
  const n=document.createElement('div');
  n.className='needle';
  n.style.left=rnd(0,100)+'%';
  n.style.background=Math.random()<.6?'#b6e3a4':'#e0b878';
  n.style.filter='blur('+rnd(0,1.5).toFixed(1)+'px)';
  stage.appendChild(n);
  const dur=rnd(7,12);
  gsap.fromTo(n,{y:-30,rotation:rnd(0,360),opacity:0},{
    y:()=>stage.clientHeight+40,x:'+='+rnd(-80,80),rotation:'+='+rnd(120,360),opacity:.9,
    duration:dur,ease:'none',repeat:-1,delay:rnd(0,dur),
    onRepeat:()=>{n.style.left=rnd(0,100)+'%';}
  });
}
if(!reduce){for(let i=0;i<24;i++)needle();}
gsap.from('.card',{y:30,opacity:0,duration:1,ease:'power3.out'});
</script>
</body>
</html>
