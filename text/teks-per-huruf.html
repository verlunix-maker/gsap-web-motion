<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animasi Teks GSAP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b1220;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{text-align:center;max-width:760px}
.big{font-size:clamp(40px,8vw,88px);font-weight:800;line-height:1.05;margin-bottom:20px}
.letter{display:inline-block;white-space:pre}
.cycle{font-size:clamp(20px,3.5vw,32px);margin-bottom:24px;color:#cbd5e1}
.cycle .holder{display:inline-block;overflow:hidden;vertical-align:bottom;color:#60a5fa;font-weight:700}
.cycle .holder span{display:inline-block}
.lead{font-size:18px;line-height:1.7;color:#94a3b8}
.word{display:inline-block;margin-right:.3em}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="big split-letters" aria-label="Animasi per huruf">Animasi per huruf</h1>
  <p class="cycle">Kami membuat <span class="holder" aria-hidden="true"></span> yang hidup.</p>
  <p class="lead split-words">Teks ini muncul kata per kata dengan efek naik dan memudar, cocok untuk paragraf pembuka di hero atau bagian penjelasan.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function splitLetters(el){
  const txt=el.textContent;
  el.textContent='';
  [...txt].forEach(ch=>{
    const s=document.createElement('span');
    s.className='letter';
    s.textContent=ch;
    el.appendChild(s);
  });
  return el.querySelectorAll('.letter');
}
function splitWords(el){
  const words=el.textContent.trim().split(/\s+/);
  el.textContent='';
  words.forEach((w,i)=>{
    const s=document.createElement('span');
    s.className='word';
    s.textContent=w;
    el.appendChild(s);
    if(i<words.length-1)el.appendChild(document.createTextNode(' '));
  });
  return el.querySelectorAll('.word');
}

const letters=splitLetters(document.querySelector('.split-letters'));
const words=splitWords(document.querySelector('.split-words'));
const dur=reduce?0:1;

gsap.from(letters,{yPercent:110,rotation:8,opacity:0,stagger:.03,duration:.8*dur,ease:'back.out(1.6)'});
gsap.from(words,{y:20,opacity:0,stagger:.06,duration:.6*dur,ease:'power3.out',delay:.5});

const cycleWords=['website','aplikasi','pengalaman digital','produk Anda'];
const holder=document.querySelector('.cycle .holder');
const current=document.createElement('span');
holder.appendChild(current);
if(!reduce){
  const tl=gsap.timeline({repeat:-1,delay:1});
  cycleWords.forEach(word=>{
    tl.call(()=>{current.textContent=word;})
      .fromTo(current,{yPercent:100,opacity:0},{yPercent:0,opacity:1,duration:.5,ease:'power3.out'})
      .to(current,{yPercent:-100,opacity:0,duration:.4,ease:'power3.in'},'+=1.6');
  });
}else{
  current.textContent=cycleWords[0];
}
</script>
</body>
</html>
