<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Farm</title>
<style>
:root{--ink:#1d3a17;--green:#3f7d2e;--gold:#e0b54e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fdf1c9;color:var(--ink)}
.hero{position:relative;min-height:560px;height:min(100svh,840px);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#bg{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(5px);z-index:0}
.shade{linear-gradient(180deg,rgba(255,250,235,0),rgba(255,250,235,.25))}
.content{position:relative;z-index:3;max-width:760px;background:rgba(255,255,255,.35);padding:32px;border-radius:24px;backdrop-filter:blur(4px)}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);border:1px solid rgba(63,125,46,.4);padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.5)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
h1{font-size:clamp(38px,7.5vw,78px);font-weight:700;line-height:1.05;margin:20px 0 16px}
h1 span{color:var(--green)}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;color:#3b5530;max-width:560px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:14px 26px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);border-color:rgba(63,125,46,.4)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px;margin:0 auto}
.stat{padding:14px 12px;border-radius:14px;background:rgba(255,255,255,.7)}
.stat b{display:block;font-size:24px;color:var(--green);font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:#5a6b4a}
@media (max-width:520px){.stats{grid-template-columns:1fr}}

</style>
</head>
<body>
<section class="hero">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hero pertanian dengan latar ladang gandum, bukit, dan burung yang diblur</h2>
  <canvas id="bg"></canvas>
  <div class="shade"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Panen hari ini</div>
    <h1>Pertanian modern <span>yang tumbuh bersama</span></h1>
    <p class="lead">Dari lahan hingga panen, kami membantu petani memantau tanaman, cuaca, dan hasil dengan lebih mudah.</p>
    <div class="actions">
      <button class="btn primary">Mulai bertani</button>
      <button class="btn ghost">Lihat hasil panen</button>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="1250" data-dec="0">0</b><small>Hektar terpantau</small></div>
      <div class="stat"><b data-count="32" data-dec="0">0</b><small>Persen lebih hemat air</small></div>
      <div class="stat"><b data-count="4800" data-dec="0">0</b><small>Petani terhubung</small></div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero=document.querySelector('.hero'),cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,clouds=[],stalks=[],birds=[];
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=hero.clientWidth+80;H=hero.clientHeight+80;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  clouds=Array.from({length:5},()=>({x:rnd(0,W),y:rnd(H*.08,H*.35),s:rnd(.7,1.4),v:rnd(8,18)}));
  stalks=[];
  for(let x=-10;x<W+10;x+=12){
    for(let r=0;r<2;r++)stalks.push({x:x+rnd(-4,4),h:rnd(H*.14,H*.22)+r*H*.03,ph:rnd(0,6.3),d:r});
  }
  birds=Array.from({length:5},()=>({x:rnd(0,W),y:rnd(H*.15,H*.4),v:rnd(20,40),ph:rnd(0,6.3)}));
}
function cloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,.85)';
  [[0,0,28],[30,-10,34],[64,0,26],[32,8,30]].forEach(([dx,dy,r])=>{
    ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,6.283);ctx.fill();
  });
}
function hill(base,amp,freq,ph,col){
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=10)ctx.lineTo(x,base+Math.sin(x*freq+ph)*amp+Math.sin(x*freq*2.3+ph*1.4)*amp*.4);
  ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=col;ctx.fill();
}
function render(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#7cc8f0');sky.addColorStop(1,'#fdf1c9');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const sx=W*.8,sy=H*.22;
  const sg=ctx.createRadialGradient(sx,sy,10,sx,sy,180);
  sg.addColorStop(0,'rgba(255,240,160,1)');sg.addColorStop(1,'rgba(255,240,160,0)');
  ctx.fillStyle=sg;ctx.fillRect(sx-180,sy-180,360,360);
  ctx.beginPath();ctx.arc(sx,sy,38,0,6.283);ctx.fillStyle='#ffe27a';ctx.fill();
  clouds.forEach(c=>{const x=((c.x+t*c.v)%(W+200))-100;cloud(x,c.y,c.s*1.2);});
  hill(H*.52,22,.008,t*.03,'#b9e39a');
  hill(H*.64,18,.012,t*.05+.5,'#8fcb6f');
  hill(H*.74,14,.02,t*.08+1,'#63a84f');
  ctx.fillStyle='#4f9340';ctx.fillRect(0,H*.84,W,H);
  stalks.forEach(s=>{
    const top=H-s.h;
    const sway=Math.sin(t*1.4+s.ph+s.x*.02)*(5+s.d*2);
    ctx.strokeStyle=s.d?'#e2b84a':'#c99a2e';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(s.x,H);ctx.quadraticCurveTo(s.x+sway*.3,H-s.h*.5,s.x+sway,top);ctx.stroke();
    ctx.beginPath();ctx.ellipse(s.x+sway,top+4,2.6,6,sway*.02,0,6.283);ctx.fillStyle='#f0c25a';ctx.fill();
  });
  birds.forEach(b=>{
    const x=((b.x+t*b.v)%(W+60))-30,y=b.y+Math.sin(t*2+b.ph)*8,f=Math.sin(t*6+b.ph)*3;
    ctx.beginPath();ctx.moveTo(x-13,y-f);ctx.lineTo(x,y);ctx.lineTo(x+13,y-f);
    ctx.strokeStyle='#1f3a22';ctx.lineWidth=3;ctx.stroke();
  });
}
resize();
new ResizeObserver(resize).observe(hero);
if(!reduce)gsap.ticker.add(()=>render(gsap.ticker.time));else render(0);

gsap.from(cv,{opacity:0,duration:1.6,ease:'power2.out'});
gsap.timeline({defaults:{ease:'power3.out'}})
  .from('.badge',{y:-14,opacity:0,duration:.7})
  .from('h1',{y:36,opacity:0,duration:1},'-=.3')
  .from('.lead',{y:20,opacity:0,duration:.8},'-=.6')
  .from('.actions .btn',{y:16,opacity:0,stagger:.1,duration:.6},'-=.5')
  .from('.stat',{y:20,opacity:0,stagger:.1,duration:.6},'-=.3');
document.querySelectorAll('[data-count]').forEach(el=>{
  const end=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec,10),o={v:0};
  gsap.to(o,{v:end,duration:2,ease:'power2.out',delay:1.2,onUpdate:()=>{el.textContent=o.v.toFixed(dec);}});
});
</script>
</body>
</html>
