<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Ocean</title>
<style>
:root{--ink:#eafaff;--aqua:#6fe3ff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#041f33;color:var(--ink)}
.hero{position:relative;min-height:560px;height:min(100svh,840px);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#bg{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(5px);z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(4,31,51,.05),rgba(4,31,51,.5))}
.content{position:relative;z-index:3;max-width:760px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--aqua);border:1px solid rgba(111,227,255,.35);padding:7px 14px;border-radius:999px;background:rgba(111,227,255,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--aqua)}
h1{font-size:clamp(38px,7.5vw,80px);font-weight:700;line-height:1.05;margin:20px 0 16px}
h1 span{color:var(--aqua)}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;color:#c4e6f2;max-width:560px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:14px 26px;border-radius:999px;cursor:pointer;border:1px solid transparent;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--aqua);color:#042538}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border-color:rgba(111,227,255,.4)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px;margin:0 auto}
.stat{padding:14px 12px;border:1px solid rgba(111,227,255,.2);border-radius:14px;background:rgba(4,31,51,.45)}
.stat b{display:block;font-size:24px;color:var(--aqua);font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:#8fbfd1}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.content h1,.content .lead{text-shadow:0 2px 18px rgba(0,0,0,.5)}
</style>
</head>
<body>
<section class="hero">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hero laut dengan latar gelombang berlapis, gelembung, dan kilau matahari yang diblur</h2>
  <canvas id="bg"></canvas>
  <div class="shade"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Laut terpantau</div>
    <h1>Jelajahi samudra <span>tanpa batas</span></h1>
    <p class="lead">Dukungan data laut dan layanan perjalanan yang aman, dari pesisir hingga perairan dalam.</p>
    <div class="actions">
      <button class="btn primary">Mulai berlayar</button>
      <button class="btn ghost">Cek kondisi laut</button>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="72" data-dec="0">0</b><small>Jam prakiraan ombak</small></div>
      <div class="stat"><b data-count="3.5" data-dec="1">0</b><small>Tinggi ombak rata-rata (m)</small></div>
      <div class="stat"><b data-count="180" data-dec="0">0</b><small>Pelabuhan terpantau</small></div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero=document.querySelector('.hero'),cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,sparkles=[],bubbles=[];
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=hero.clientWidth+80;H=hero.clientHeight+80;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  sparkles=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,H*.4),r:rnd(.8,2),ph:rnd(0,6.3)}));
  bubbles=Array.from({length:18},()=>({x:rnd(0,W),y0:rnd(0,H),v:rnd(20,50),r:rnd(2,6),sw:rnd(4,12),ph:rnd(0,6.3)}));
}
const LAYERS=[
  {base:.42,amp:14,spd:.6,ph:0,col:'rgba(70,200,230,.4)'},
  {base:.55,amp:20,spd:.85,ph:1.3,col:'rgba(45,170,210,.55)'},
  {base:.68,amp:26,spd:1.1,ph:2.6,col:'rgba(25,130,180,.7)'},
  {base:.82,amp:32,spd:1.4,ph:3.9,col:'rgba(12,85,130,.85)'}
];
function render(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0e4a6e');sky.addColorStop(1,'#03182a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const sx=W*.72,sy=H*.12;
  const sg=ctx.createRadialGradient(sx,sy,8,sx,sy,160);
  sg.addColorStop(0,'rgba(255,240,190,.95)');sg.addColorStop(1,'rgba(255,240,190,0)');
  ctx.fillStyle=sg;ctx.fillRect(sx-160,sy-160,320,320);
  sparkles.forEach(s=>{
    const a=.35+.55*Math.sin(t*2+s.ph);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.3,0,6.283);ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill();
  });
  LAYERS.forEach(L=>{
    const pts=[];
    for(let x=0;x<=W;x+=8)pts.push([x,H*L.base+Math.sin(x*.012+t*L.spd+L.ph)*L.amp+Math.sin(x*.027-t*L.spd*1.6)*L.amp*.35]);
    ctx.beginPath();ctx.moveTo(0,H);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle=L.col;ctx.fill();
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle='rgba(210,248,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
  });
  bubbles.forEach(b=>{
    const y=H-((b.y0+t*b.v)%H);
    const x=b.x+Math.sin(t*1.5+b.ph)*b.sw;
    ctx.beginPath();ctx.arc(x,y,b.r*1.2,0,6.283);
    ctx.strokeStyle='rgba(220,248,255,.7)';ctx.lineWidth=1.5;ctx.stroke();
  });
}
resize();
new ResizeObserver(resize).observe(hero);
const t0=performance.now();
function loop(){render((performance.now()-t0)/1000);if(!reduce)requestAnimationFrame(loop);}
loop();

gsap.from(cv,{opacity:0,duration:1.6,ease:'power2.out'});
gsap.timeline({defaults:{ease:'power3.out'}})
  .from('.badge',{y:-14,opacity:0,duration:.7})
  .from('h1',{y:36,opacity:0,duration:1},'-=.3')
  .from('.lead',{y:20,opacity:0,duration:.8},'-=.6')
  .from('.actions .btn',{y:16,opacity:0,stagger:.1,duration:.6},'-=.5')
  .from('.stat',{y:20,opacity:0,stagger:.1,duration:.6},'-=.3');
document.querySelectorAll('[data-count]').forEach(el=>{
  const end=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec,10),o={v:0};
  gsap.to(o,{v:end,duration:2,ease:'power2.out',delay:1.2,onUpdate:()=>{el.textContent=o.v.toFixed(dec);}});
});
</script>
</body>
</html>
