<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero High Tech</title>
<style>
:root{--ink:#e6f7ff;--cyan:#00e5ff;--violet:#7c5cff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#050b18;color:var(--ink)}
.hero{position:relative;min-height:560px;height:min(100svh,840px);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#bg{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(7px);z-index:0}
.glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(0,229,255,.12),transparent 60%),linear-gradient(180deg,rgba(5,11,24,.2),rgba(5,11,24,.85))}
.content{position:relative;z-index:3;max-width:760px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,229,255,.35);padding:7px 14px;border-radius:999px;background:rgba(0,229,255,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
h1{font-size:clamp(38px,7.5vw,80px);font-weight:700;line-height:1.05;margin:20px 0 16px;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;color:#a9c7d6;max-width:560px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:14px 26px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--cyan);color:#03121f;box-shadow:0 0 24px rgba(0,229,255,.35)}
.btn.primary:hover{box-shadow:0 0 36px rgba(0,229,255,.55)}
.btn.ghost{background:rgba(255,255,255,.03);color:var(--ink);border-color:rgba(0,229,255,.4)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px;margin:0 auto}
.stat{padding:14px 12px;border:1px solid rgba(0,229,255,.2);border-radius:12px;background:rgba(5,15,30,.5)}
.stat b{display:block;font-size:24px;color:var(--cyan);font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:#7f9fb0;letter-spacing:.04em}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="hero">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hero high tech dengan latar grid dan jalur sirkuit yang diblur</h2>
  <canvas id="bg"></canvas>
  <div class="glow"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Sistem aktif</div>
    <h1>Masa depan digital <span>dalam genggaman</span></h1>
    <p class="lead">Platform cerdas yang menghubungkan data, perangkat, dan manusia dalam satu ekosistem yang cepat, aman, dan terukur.</p>
    <div class="actions">
      <button class="btn primary">Mulai sekarang</button>
      <button class="btn ghost">Lihat demo</button>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="99.9" data-dec="1">0</b><small>Uptime sistem (%)</small></div>
      <div class="stat"><b data-count="12" data-dec="0">0</b><small>Latensi rata-rata (ms)</small></div>
      <div class="stat"><b data-count="24" data-dec="0">0</b><small>Pemantauan (jam/hari)</small></div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const hero=document.querySelector('.hero');
const cv=document.getElementById('bg');
const ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,traces=[];
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=hero.clientWidth+80;H=hero.clientHeight+80;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildTraces();
}

function buildTraces(){
  traces=[];
  const step=60;
  for(let i=0;i<16;i++){
    let x=Math.round(rnd(0,W)/step)*step,y=Math.round(rnd(0,H*.6)/step)*step;
    const pts=[[x,y]];
    const steps=3+Math.floor(rnd(0,3));
    for(let s=0;s<steps;s++){
      if(s%2===0)x=Math.min(W,Math.max(0,x+(Math.random()<.5?-1:1)*step*Math.ceil(rnd(1,4))));
      else y=Math.min(H*.6,Math.max(0,y+(Math.random()<.5?-1:1)*step*Math.ceil(rnd(1,3))));
      pts.push([x,y]);
    }
    let len=0;
    for(let k=1;k<pts.length;k++)len+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);
    traces.push({pts,len,speed:rnd(.12,.3),off:rnd(0,1)});
  }
}

function pointAt(tr,u){
  let d=u*tr.len;
  for(let k=1;k<tr.pts.length;k++){
    const a=tr.pts[k-1],b=tr.pts[k];
    const seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(d<=seg){const f=d/seg;return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
    d-=seg;
  }
  return tr.pts[tr.pts.length-1];
}

function render(time){
  const t=time;
  const horizon=H*.56,cx=W/2;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#050b18');bg.addColorStop(1,'#0b1d33');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  traces.forEach(tr=>{
    ctx.beginPath();
    tr.pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle='rgba(0,229,255,.18)';ctx.lineWidth=1.2;ctx.stroke();
    tr.pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.2,0,6.283);ctx.fillStyle='rgba(0,229,255,.35)';ctx.fill();});
    const u=(t*tr.speed+tr.off)%1;
    const [px,py]=pointAt(tr,u);
    ctx.beginPath();ctx.arc(px,py,3.5,0,6.283);
    ctx.fillStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
  });

  ctx.save();
  ctx.beginPath();ctx.rect(0,horizon,W,H-horizon);ctx.clip();
  const rows=14,shift=(t*.35)%1;
  for(let i=0;i<=rows;i++){
    const z=((i+shift)/rows);
    const y=horizon+(H-horizon)*z*z;
    ctx.strokeStyle='rgba(124,92,255,'+(.08+.25*z*z)+')';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  for(let j=-14;j<=14;j++){
    ctx.strokeStyle='rgba(0,229,255,.14)';
    ctx.beginPath();ctx.moveTo(cx+j*12,horizon);ctx.lineTo(cx+j*W*.12,H);ctx.stroke();
  }
  ctx.restore();

  const hl=ctx.createLinearGradient(0,horizon-40,0,horizon+40);
  hl.addColorStop(0,'rgba(0,229,255,0)');hl.addColorStop(.5,'rgba(0,229,255,.18)');hl.addColorStop(1,'rgba(0,229,255,0)');
  ctx.fillStyle=hl;ctx.fillRect(0,horizon-40,W,80);
}

function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const end=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec,10);
    const o={v:0};
    gsap.to(o,{v:end,duration:2,ease:'power2.out',delay:1.2,onUpdate:()=>{el.textContent=o.v.toFixed(dec);}});
  });
}

resize();
new ResizeObserver(resize).observe(hero);
gsap.ticker.add(render);
gsap.from(cv,{opacity:0,duration:1.6,ease:'power2.out'});
gsap.timeline({defaults:{ease:'power3.out'}})
  .from('.badge',{y:-14,opacity:0,duration:.7})
  .from('h1',{y:36,opacity:0,duration:1},'-=.3')
  .from('.lead',{y:20,opacity:0,duration:.8},'-=.6')
  .from('.actions .btn',{y:16,opacity:0,stagger:.1,duration:.6},'-=.5')
  .from('.stat',{y:20,opacity:0,stagger:.1,duration:.6},'-=.3');
countUp();
</script>
</body>
</html>
