<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero City Night</title>
<style>
:root{--ink:#f1f5ff;--warm:#ffd27a;--violet:#9d7bff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#070b18;color:var(--ink)}
.hero{position:relative;min-height:560px;height:min(100svh,840px);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#bg{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(5px);z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 30%,rgba(157,123,255,.12),transparent 60%),linear-gradient(180deg,rgba(7,11,24,.02),rgba(7,11,24,.5))}
.content{position:relative;z-index:3;max-width:760px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--warm);border:1px solid rgba(255,210,122,.35);padding:7px 14px;border-radius:999px;background:rgba(255,210,122,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warm)}
h1{font-size:clamp(38px,7.5vw,80px);font-weight:700;line-height:1.05;margin:20px 0 16px}
h1 span{background:linear-gradient(90deg,var(--warm),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;color:#c9d2ea;max-width:560px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:14px 26px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--warm);color:#2a1d00}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border-color:rgba(157,123,255,.45)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px;margin:0 auto}
.stat{padding:14px 12px;border:1px solid rgba(157,123,255,.25);border-radius:12px;background:rgba(10,14,30,.5)}
.stat b{display:block;font-size:24px;color:var(--warm);font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:#9aa6c9}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.content h1,.content .lead{text-shadow:0 2px 18px rgba(0,0,0,.5)}
</style>
</head>
<body>
<section class="hero">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hero kota malam dengan skyline, jendela berkedip, dan hujan yang diblur</h2>
  <canvas id="bg"></canvas>
  <div class="shade"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Kota pintar</div>
    <h1>Kota yang terus <span>menyala</span></h1>
    <p class="lead">Layanan perkotaan terhubung, dari transportasi hingga keamanan, yang bekerja sepanjang malam.</p>
    <div class="actions">
      <button class="btn primary">Jelajahi kota</button>
      <button class="btn ghost">Lihat layanan</button>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="1.2" data-dec="1">0</b><small>Juta penduduk terlayani</small></div>
      <div class="stat"><b data-count="850" data-dec="0">0</b><small>Titik CCTV terpantau</small></div>
      <div class="stat"><b data-count="24" data-dec="0">0</b><small>Jam layanan aktif</small></div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero=document.querySelector('.hero'),cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,buildings=[],stars=[],drops=[];
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=hero.clientWidth+80;H=hero.clientHeight+80;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  buildings=[];
  let x=-20,id=0;
  while(x<W+20){
    const w=rnd(40,90),h=rnd(H*.25,H*.6);
    buildings.push({x,w,h,id:id++});
    x+=w+rnd(-6,4);
  }
  stars=Array.from({length:80},()=>({x:rnd(0,W),y:rnd(0,H*.5),r:rnd(.5,1.4),ph:rnd(0,6.3)}));
  drops=Array.from({length:120},()=>({x:rnd(0,W),y0:rnd(0,H),v:rnd(500,800),len:rnd(10,20)}));
}
function render(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0b0f2a');sky.addColorStop(.7,'#2a1f4a');sky.addColorStop(1,'#5a2f4a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    const a=.4+.6*Math.abs(Math.sin(t*1.5+s.ph));
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.2,0,6.283);ctx.fillStyle='rgba(235,240,255,'+a+')';ctx.fill();
  });
  const mx=W*.82,my=H*.18;
  const mg=ctx.createRadialGradient(mx,my,20,mx,my,120);
  mg.addColorStop(0,'rgba(243,239,224,.35)');mg.addColorStop(1,'rgba(243,239,224,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-120,my-120,240,240);
  ctx.beginPath();ctx.arc(mx,my,30,0,6.283);ctx.fillStyle='#f3efe0';ctx.fill();
  buildings.forEach(b=>{
    const top=H-b.h;
    ctx.fillStyle='#161d40';ctx.fillRect(b.x,top,b.w,b.h);
    ctx.fillStyle='rgba(140,160,255,.4)';ctx.fillRect(b.x,top,2,b.h);
    const cols=Math.max(1,Math.floor(b.w/12)),rows=Math.floor(b.h/16);
    for(let r=1;r<rows;r++){
      for(let c=0;c<cols;c++){
        const seed=b.id*997+r*31+c*17;
        if(Math.sin(t*(.4+(seed%5)*.25)+seed)<=.2)continue;
        const glow=seed%3===0;
        ctx.fillStyle='rgba(255,214,130,.95)';
        if(glow){ctx.shadowColor='#ffd27a';ctx.shadowBlur=8;}
        ctx.fillRect(b.x+5+c*12,top+r*16,6,9);
        ctx.shadowBlur=0;
      }
    }
  });
  const hg=ctx.createLinearGradient(0,H*.75,0,H);
  hg.addColorStop(0,'rgba(255,120,80,0)');hg.addColorStop(1,'rgba(255,120,80,.35)');
  ctx.fillStyle=hg;ctx.fillRect(0,H*.75,W,H*.25);
  ctx.strokeStyle='rgba(200,215,255,.5)';ctx.lineWidth=1.2;
  drops.forEach(d=>{
    const y=((d.y0+t*d.v)%(H+40))-20;
    const x=d.x-y*.15;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-d.len*.2,y-d.len);ctx.stroke();
  });
}
resize();
new ResizeObserver(resize).observe(hero);
const t0=performance.now();
function loop(){render((performance.now()-t0)/1000);if(!reduce)requestAnimationFrame(loop);}
loop();

gsap.from(cv,{opacity:0,duration:1.6,ease:'power2.out'});
gsap.timeline({defaults:{ease:'power3.out'}})
  .from('.badge',{y:-14,opacity:0,duration:.7})
  .from('h1',{y:36,opacity:0,duration:1},'-=.3')
  .from('.lead',{y:20,opacity:0,duration:.8},'-=.6')
  .from('.actions .btn',{y:16,opacity:0,stagger:.1,duration:.6},'-=.5')
  .from('.stat',{y:20,opacity:0,stagger:.1,duration:.6},'-=.3');
document.querySelectorAll('[data-count]').forEach(el=>{
  const end=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec,10),o={v:0};
  gsap.to(o,{v:end,duration:2,ease:'power2.out',delay:1.2,onUpdate:()=>{el.textContent=o.v.toFixed(dec);}});
});
</script>
</body>
</html>
