<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Power Supply</title>
<style>
:root{--ink:#fff4e0;--amber:#ffb84d;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#060a12;color:var(--ink)}
.hero{position:relative;min-height:560px;height:min(100svh,840px);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#bg{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(5px);z-index:0}
.shade{radial-gradient(ellipse at 50% 40%,rgba(255,184,77,.12),transparent 60%),linear-gradient(180deg,rgba(6,10,18,.05),rgba(6,10,18,.5))}
.content{position:relative;z-index:3;max-width:760px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,184,77,.35);padding:7px 14px;border-radius:999px;background:rgba(255,184,77,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
h1{font-size:clamp(38px,7.5vw,80px);font-weight:700;line-height:1.05;margin:20px 0 16px}
h1 span{background:linear-gradient(90deg,#ffd27a,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;color:#e9d9bd;max-width:560px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:14px 26px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--amber);color:#2a1700}
.btn.ghost{background:rgba(255,255,255,.03);color:var(--ink);border-color:rgba(255,184,77,.4)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px;margin:0 auto}
.stat{padding:14px 12px;border:1px solid rgba(255,184,77,.2);border-radius:12px;background:rgba(15,12,8,.5)}
.stat b{display:block;font-size:24px;color:var(--amber);font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:#c4b08f}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.content h1,.content .lead{text-shadow:0 2px 18px rgba(0,0,0,.5)}
</style>
</head>
<body>
<section class="hero">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hero pasokan listrik dengan latar tiang transmisi yang diblur</h2>
  <canvas id="bg"></canvas>
  <div class="shade"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Pasokan aktif</div>
    <h1>Daya stabil <span>untuk setiap kebutuhan</span></h1>
    <p class="lead">Jaringan distribusi yang andal, dengan pemantauan real-time dari pembangkit hingga ke rumah dan industri.</p>
    <div class="actions">
      <button class="btn primary">Cek layanan</button>
      <button class="btn ghost">Lihat jaringan</button>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="99.99" data-dec="2">0</b><small>Keandalan pasokan (%)</small></div>
      <div class="stat"><b data-count="500" data-dec="0">0</b><small>Kapasitas (MW)</small></div>
      <div class="stat"><b data-count="24" data-dec="0">0</b><small>Pemantauan (jam/hari)</small></div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero=document.querySelector('.hero'),cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,towers=[],wires=[];
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=hero.clientWidth+80;H=hero.clientHeight+80;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  towers=[];
  const n=6;
  for(let i=0;i<=n;i++)towers.push({x:i/n*W*1.1-W*.05,base:H*.92,top:H*rnd(.42,.5)});
  wires=[];
  for(let i=0;i<towers.length-1;i++){
    const a=towers[i],b=towers[i+1];
    for(const k of [0,1,2]){
      const ya=a.top+(k-1)*22,yb=b.top+(k-1)*22;
      wires.push({x0:a.x,y0:ya,x1:b.x,y1:yb,cx:(a.x+b.x)/2,cy:Math.max(ya,yb)+30,off:rnd(0,1),sp:rnd(.15,.35)});
    }
  }
}
function bez(w,u){
  return[(1-u)*(1-u)*w.x0+2*(1-u)*u*w.cx+u*u*w.x1,(1-u)*(1-u)*w.y0+2*(1-u)*u*w.cy+u*u*w.y1];
}
function render(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a1424');sky.addColorStop(1,'#1d2e44');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const hz=ctx.createRadialGradient(W*.5,H,10,W*.5,H,W*.6);
  hz.addColorStop(0,'rgba(255,170,70,.35)');hz.addColorStop(1,'rgba(255,170,70,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#253445';ctx.fillRect(0,H*.9,W,H*.1);
  towers.forEach(tw=>{
    ctx.strokeStyle='rgba(200,215,230,.85)';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.moveTo(tw.x,tw.base);ctx.lineTo(tw.x,tw.top);ctx.stroke();
    ctx.lineWidth=2.5;
    [[.2,70],[.45,120],[.7,160]].forEach(([f,w])=>{
      const y=tw.top+(tw.base-tw.top)*f;
      ctx.beginPath();ctx.moveTo(tw.x-w/2,y);ctx.lineTo(tw.x+w/2,y);ctx.stroke();
    });
    ctx.beginPath();ctx.moveTo(tw.x-24,tw.top);ctx.lineTo(tw.x,tw.top-34);ctx.lineTo(tw.x+24,tw.top);ctx.stroke();
    const glow=.6+.4*Math.sin(t*2+tw.x);
    ctx.beginPath();ctx.arc(tw.x,tw.top-34,5,0,6.283);
    ctx.fillStyle='rgba(255,190,90,'+glow+')';ctx.shadowColor='#ffb84d';ctx.shadowBlur=24;ctx.fill();ctx.shadowBlur=0;
  });
  wires.forEach(w=>{
    ctx.beginPath();ctx.moveTo(w.x0,w.y0);ctx.quadraticCurveTo(w.cx,w.cy,w.x1,w.y1);
    ctx.strokeStyle='rgba(220,230,240,.55)';ctx.lineWidth=2;ctx.stroke();
    const u=(t*w.sp+w.off)%1,p=bez(w,u);
    ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,6.283);
    ctx.fillStyle='#ffc766';ctx.shadowColor='#ffb84d';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  });
}
resize();
new ResizeObserver(resize).observe(hero);
const t0=performance.now();
function loop(){render((performance.now()-t0)/1000);if(!reduce)requestAnimationFrame(loop);}
loop();

gsap.from(cv,{opacity:0,duration:1.6,ease:'power2.out'});
gsap.timeline({defaults:{ease:'power3.out'}})
  .from('.badge',{y:-14,opacity:0,duration:.7})
  .from('h1',{y:36,opacity:0,duration:1},'-=.3')
  .from('.lead',{y:20,opacity:0,duration:.8},'-=.6')
  .from('.actions .btn',{y:16,opacity:0,stagger:.1,duration:.6},'-=.5')
  .from('.stat',{y:20,opacity:0,stagger:.1,duration:.6},'-=.3');
document.querySelectorAll('[data-count]').forEach(el=>{
  const end=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec,10),o={v:0};
  gsap.to(o,{v:end,duration:2,ease:'power2.out',delay:1.2,onUpdate:()=>{el.textContent=o.v.toFixed(dec);}});
});
</script>
</body>
</html>
