<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Electricity</title>
<style>
:root{--ink:#e8f7ff;--blue:#7fd4ff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#03060c;color:var(--ink)}
.hero{position:relative;min-height:560px;height:min(100svh,840px);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#bg{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(5px);z-index:0}
.shade{radial-gradient(ellipse at 50% 50%,rgba(127,212,255,.10),transparent 60%),linear-gradient(180deg,rgba(3,6,12,.05),rgba(3,6,12,.55))}
.content{position:relative;z-index:3;max-width:760px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);border:1px solid rgba(127,212,255,.35);padding:7px 14px;border-radius:999px;background:rgba(127,212,255,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
h1{font-size:clamp(38px,7.5vw,80px);font-weight:800;line-height:1.05;margin:20px 0 16px}
h1 span{color:var(--blue);text-shadow:0 0 24px rgba(127,212,255,.5)}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.6;color:#b6d6e8;max-width:560px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:14px 26px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--blue);color:#021a2b;box-shadow:0 0 24px rgba(127,212,255,.35)}
.btn.ghost{background:rgba(255,255,255,.03);color:var(--ink);border-color:rgba(127,212,255,.4)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px;margin:0 auto}
.stat{padding:14px 12px;border:1px solid rgba(127,212,255,.2);border-radius:12px;background:rgba(5,12,22,.5)}
.stat b{display:block;font-size:24px;color:var(--blue);font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:#7f9fb0}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.content h1,.content .lead{text-shadow:0 2px 18px rgba(0,0,0,.5)}
</style>
</head>
<body>
<section class="hero">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hero listrik dengan latar kilat yang berkedip dan diblur</h2>
  <canvas id="bg"></canvas>
  <div class="shade"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Energi terkendali</div>
    <h1>Tenaga listrik <span>yang bergerak cepat</span></h1>
    <p class="lead">Solusi kelistrikan untuk rumah, bisnis, dan industri, dengan respons instan dan keamanan yang teruji.</p>
    <div class="actions">
      <button class="btn primary">Mulai hemat energi</button>
      <button class="btn ghost">Pelajari produk</button>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="0.3" data-dec="1">0</b><small>Waktu respons (detik)</small></div>
      <div class="stat"><b data-count="98" data-dec="0">0</b><small>Efisiensi (%)</small></div>
      <div class="stat"><b data-count="1200" data-dec="0">0</b><small>Titik pantau</small></div>
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero=document.querySelector('.hero'),cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,bolts=[],nextBolt=0,flash=0,last=0;
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=hero.clientWidth+80;H=hero.clientHeight+80;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
function makeBolt(){
  let x=rnd(W*.1,W*.9),y=-10;
  const pts=[[x,y]];
  while(y<H*.92){y+=rnd(16,30);x+=rnd(-24,24);pts.push([x,y]);}
  const br=[];
  if(Math.random()<.7){
    const i=Math.floor(rnd(2,pts.length-3));
    let bx=pts[i][0],by=pts[i][1];const b=[[bx,by]];
    for(let k=0;k<7;k++){by+=rnd(12,22);bx+=rnd(-18,26);b.push([bx,by]);}
    br.push(b);
  }
  return{pts,br};
}
function strokePath(pts,a,w){
  ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle='rgba(127,212,255,'+a+')';ctx.lineWidth=w;
  ctx.shadowColor='#9fe2ff';ctx.shadowBlur=32;ctx.stroke();ctx.shadowBlur=0;
}
let orbs=[];
function render(t){
  const dt=Math.min(.05,t-last);last=t;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#05080f');bg.addColorStop(1,'#0c1a30');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(127,212,255,.14)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  if(!orbs.length)orbs=Array.from({length:5},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(120,220),ph:rnd(0,6)}));
  orbs.forEach(o=>{
    const a=.25+.2*Math.sin(t*1.3+o.ph);
    const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    g.addColorStop(0,'rgba(127,212,255,'+a+')');g.addColorStop(1,'rgba(127,212,255,0)');
    ctx.fillStyle=g;ctx.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2);
  });
  if(!reduce&&t>=nextBolt){
    bolts.push({...makeBolt(),born:t});
    nextBolt=t+rnd(.5,1.2);
    flash=1;
  }
  bolts=bolts.filter(b=>t-b.born<.5);
  bolts.forEach(b=>{
    const a=1-(t-b.born)/.5;
    strokePath(b.pts,a,8);
    strokePath(b.pts,1,2.5);
    b.br.forEach(p=>{strokePath(p,a*.9,4);strokePath(p,1,1.5);});
  });
  flash=Math.max(0,flash-dt*2.5);
  if(flash>0){ctx.fillStyle='rgba(160,225,255,'+(flash*.3)+')';ctx.fillRect(0,0,W,H);}
}
resize();
new ResizeObserver(resize).observe(hero);
if(!reduce)gsap.ticker.add(()=>render(gsap.ticker.time));else render(0);

gsap.from(cv,{opacity:0,duration:1.6,ease:'power2.out'});
gsap.timeline({defaults:{ease:'power3.out'}})
  .from('.badge',{y:-14,opacity:0,duration:.7})
  .from('h1',{y:36,opacity:0,duration:1},'-=.3')
  .from('.lead',{y:20,opacity:0,duration:.8},'-=.6')
  .from('.actions .btn',{y:16,opacity:0,stagger:.1,duration:.6},'-=.5')
  .from('.stat',{y:20,opacity:0,stagger:.1,duration:.6},'-=.3');
document.querySelectorAll('[data-count]').forEach(el=>{
  const end=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec,10),o={v:0};
  gsap.to(o,{v:end,duration:2,ease:'power2.out',delay:1.2,onUpdate:()=>{el.textContent=o.v.toFixed(dec);}});
});
</script>
</body>
</html>
