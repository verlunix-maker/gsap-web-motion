<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latar Hutan Pinus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1d3a2c;color:#f4f8f1}
.bg-wrap{position:relative;height:100vh;min-height:520px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#c{position:absolute;left:-20px;top:-20px;width:calc(100% + 40px);height:calc(100% + 40px);filter:blur(6px);z-index:0}
.label{position:relative;z-index:1;padding:24px;background:rgba(10,30,20,.35);border-radius:16px;max-width:520px}
.label h1{font-size:clamp(32px,6vw,56px);font-weight:700;margin-bottom:8px}
.label p{color:#e4efdf;line-height:1.6}
</style>
</head>
<body>
<section class="bg-wrap">
  <canvas id="c"></canvas>
  <div class="label">
    <h1>Latar Hutan Pinus</h1>
    <p>Pepohonan berlapis bergoyang pelan dengan kabut dan sinar matahari. Ganti isi kartu ini dengan konten Anda.</p>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wrap=document.querySelector('.bg-wrap');
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const LAYERS=[
  {n:16,hs:[.22,.34],by:[.74,.8],col:'#a9cdb8',sway:.008,fog:.5},
  {n:10,hs:[.36,.52],by:[.82,.88],col:'#5d937a',sway:.016,fog:.2},
  {n:6,hs:[.55,.72],by:[.92,.98],col:'#1f5b3e',sway:.028,fog:0}
];
let W=0,H=0,dpr=1,trees=[];
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=wrap.clientWidth+40;H=wrap.clientHeight+40;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  trees=[];
  LAYERS.forEach((l,li)=>{
    for(let i=0;i<l.n;i++){
      trees.push({li,x:(i/(l.n-1))*W*1.1-W*.05+rnd(-12,12),by:H*rnd(l.by[0],l.by[1]),h:H*rnd(l.hs[0],l.hs[1]),ph:rnd(0,6.3)});
    }
  });
  draw(gsap.ticker.time);
}

function drawPine(tr,t){
  const L=LAYERS[tr.li];
  const ang=Math.sin(t*1.2+tr.ph)*L.sway+Math.sin(t*.5+tr.ph*2)*L.sway*.4;
  const h=tr.h,hw0=h*.22;
  ctx.save();ctx.translate(tr.x,tr.by);ctx.rotate(ang);
  ctx.fillStyle=L.col;
  ctx.fillRect(-h*.012,-h*.2,h*.024,h*.2);
  for(let i=0;i<5;i++){
    const yb=-h*(.3+.14*i),hw=hw0-h*.035*i,yt=yb-h*.22;
    ctx.beginPath();ctx.moveTo(0,yt);
    ctx.quadraticCurveTo(hw*.7,yt+h*.1,hw,yb);
    ctx.quadraticCurveTo(0,yb-h*.05,-hw,yb);
    ctx.quadraticCurveTo(-hw*.7,yt+h*.1,0,yt);
    ctx.fill();
  }
  ctx.restore();
}

function draw(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#e8f4ec');sky.addColorStop(1,'#f7f3e3');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  LAYERS.forEach((l,li)=>{
    trees.filter(tr=>tr.li===li).forEach(tr=>drawPine(tr,t));
    if(l.fog){
      const g=ctx.createLinearGradient(0,H*.5,0,H);
      g.addColorStop(0,'rgba(240,247,240,0)');g.addColorStop(1,'rgba(240,247,240,'+l.fog+')');
      ctx.fillStyle=g;ctx.fillRect(0,H*.5,W,H*.5);
    }
  });
  ctx.fillStyle='#6b5a3c';ctx.fillRect(0,H*.94,W,H*.06);
  for(let i=0;i<3;i++){
    const x=W*(.2+.3*i)+Math.sin(t*.3+i)*30;
    const a=.05+.03*Math.sin(t*.8+i*2);
    ctx.fillStyle='rgba(255,247,214,'+a+')';
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+60,0);ctx.lineTo(x+260,H);ctx.lineTo(x+160,H);ctx.closePath();ctx.fill();
  }
}

resize();
new ResizeObserver(resize).observe(wrap);
if(!reduce){gsap.ticker.add(()=>draw(gsap.ticker.time));}
gsap.from('.label',{y:30,opacity:0,duration:1.2,ease:'power3.out',delay:.3});
</script>
</body>
</html>
